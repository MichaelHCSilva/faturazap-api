<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>FaturaZap - Simulador WhatsApp</title>
    <style>
        body { font-family: Arial, sans-serif; background: #efeae2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; height: 680px; background: #efeae2; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #ccc; }
        .chat-header { background: #00a884; color: white; padding: 15px; font-weight: bold; font-size: 16px; display: flex; align-items: center; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .user-message { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .bot-message { background: #ffffff; align-self: flex-start; border-top-left-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .message img { max-width: 100%; border-radius: 6px; margin-top: 5px; }
        .chat-input { display: flex; padding: 10px; background: #f0f2f5; gap: 8px; align-items: center; }
        .chat-input select { padding: 8px; border: 1px solid #ccc; border-radius: 15px; outline: none; width: 28%; font-size: 12px; }
        .chat-input input[type="text"], .chat-input input[type="file"] { padding: 8px; border: 1px solid #ccc; border-radius: 15px; outline: none; flex: 1; font-size: 13px; background: white; }
        .chat-input button { background: #00a884; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🟢 FaturaZap (Simulador WhatsApp)</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">Olá! Envie um link, PDF ou selecione a opção "Foto do Cupom" para testar a visão da IA.</div>
    </div>
    <div class="chat-input">
        <select id="msgType" onchange="toggleInputType()">
            <option value="qrcode">QR Code (Link)</option>
            <option value="image">📸 Foto do Cupom</option>
            <option value="pdf">PDF</option>
            <option value="summary">Resumo</option>
        </select>
        
        <!-- Input dinâmico: Texto ou Arquivo de Imagem -->
        <input type="text" id="msgContentText" placeholder="Cole o link aqui..." />
        <input type="file" id="msgContentFile" accept="image/*" style="display: none;" />
        
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    function toggleInputType() {
        const type = document.getElementById('msgType').value;
        const textInput = document.getElementById('msgContentText');
        const fileInput = document.getElementById('msgContentFile');

        if (type === 'image') {
            textInput.style.display = 'none';
            fileInput.style.display = 'block';
        } else if (type === 'summary') {
            textInput.style.display = 'none';
            fileInput.style.display = 'none';
        } else {
            textInput.style.display = 'block';
            fileInput.style.display = 'none';
        }
    }

    async function sendMessage() {
        const typeSelect = document.getElementById('msgType');
        const textInput = document.getElementById('msgContentText');
        const fileInput = document.getElementById('msgContentFile');
        const messagesDiv = document.getElementById('chatMessages');

        const type = typeSelect.value;
        const messagesDivScroll = () => { messagesDiv.scrollTop = messagesDiv.scrollHeight; };

        const userBubble = document.createElement('div');
        userBubble.className = 'message user-message';

        let formData = new FormData();
        formData.append('type', type);

        if (type === 'summary') {
            userBubble.innerText = 'Quero meu resumo financeiro';
        } else if (type === 'image') {
            if (fileInput.files.length === 0) return alert('Selecione uma imagem de cupom primeiro!');
            const file = fileInput.files[0];
            formData.append('image', file);
            
            // Mostra a foto miniatura no chat do simulador
            const reader = new FileReader();
            reader.onload = function(e) {
                userBubble.innerHTML = `📸 Foto enviada:<br><img src="${e.target.result}" />`;
                messagesDivScroll();
            }
            reader.readAsDataURL(file);
            fileInput.value = '';
        } else {
            const content = textInput.value.trim();
            if (!content) return;
            userBubble.innerText = content;
            formData.append('content', content);
            textInput.value = '';
        }

        messagesDiv.appendChild(userBubble);
        messagesDivScroll();

        try {
            let endpoint = '/webhook/whatsapp';
            let options = { method: 'POST', body: formData };

            if (type === 'summary') {
                endpoint = '/webhook/summary';
                options = { method: 'GET' };
            }

            const response = await fetch(endpoint, options);
            const data = await response.json();
            
            const botBubble = document.createElement('div');
            botBubble.className = 'message bot-message';
            botBubble.innerText = data.response_message || data.summary || JSON.stringify(data);
            messagesDiv.appendChild(botBubble);
            messagesDivScroll();

        } catch (error) {
            const errorBubble = document.createElement('div');
            errorBubble.className = 'message bot-message';
            errorBubble.innerText = '❌ Erro de conexão com a API Flask.';
            messagesDiv.appendChild(errorBubble);
            messagesDivScroll();
        }
    }
</script>

</body>
</html>
