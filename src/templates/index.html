<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FaturaZap - Simulador WhatsApp</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #efeae2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; max-width: 100%; height: 680px; max-height: 100vh; background: #efeae2; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,.2); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #ccc; }
        .chat-header { background: #00a884; color: #fff; padding: 15px; font-weight: bold; font-size: 16px; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
        .user-message { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .bot-message { background: #fff; align-self: flex-start; border-top-left-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,.1); }
        .bot-message.pending { color: #888; font-style: italic; }
        .message img { display: block; max-width: 100%; border-radius: 6px; margin-top: 5px; }
        .chat-input { display: flex; padding: 10px; background: #f0f2f5; gap: 8px; align-items: center; }
        .chat-input select { padding: 8px; border: 1px solid #ccc; border-radius: 15px; outline: none; width: 30%; font-size: 12px; }
        .chat-input input { padding: 8px; border: 1px solid #ccc; border-radius: 15px; outline: none; flex: 1; min-width: 0; font-size: 13px; background: #fff; }
        .chat-input button { background: #00a884; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; flex-shrink: 0; }
        .chat-input button:disabled { background: #9bcfc4; cursor: not-allowed; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🟢 FaturaZap (Simulador WhatsApp)</div>
    <div class="chat-messages" id="chatMessages" aria-live="polite">
        <div class="message bot-message">Olá! Envie um link de QR Code, uma foto do cupom ou um PDF de fatura para testar.</div>
    </div>
    <div class="chat-input">
        <select id="msgType" aria-label="Tipo de mensagem">
            <option value="qrcode">QR Code (Link)</option>
            <option value="image">📸 Foto do Cupom</option>
            <option value="pdf">📄 PDF</option>
            <option value="summary">Resumo</option>
            <option value="reprocess">Reprocessar fila</option>
        </select>
        <input type="text" id="textInput" placeholder="Cole o link aqui..." aria-label="Link do QR Code">
        <input type="file" id="fileInput" hidden aria-label="Arquivo">
        <button id="sendBtn" type="button" aria-label="Enviar">➤</button>
    </div>
</div>

<script>
    // Cada tipo define qual campo de entrada aparece e como a requisição é montada.
    const TYPES = {
        qrcode:    { input: 'text', field: 'content' },
        image:     { input: 'file', field: 'image', accept: 'image/*', label: '📸 Foto enviada' },
        pdf:       { input: 'file', field: 'file',  accept: 'application/pdf', label: '📄 PDF enviado' },
        summary:   { input: null, endpoint: '/webhook/summary', method: 'GET',  userText: 'Quero meu resumo financeiro' },
        reprocess: { input: null, endpoint: '/webhook/reprocess', method: 'POST', userText: 'Reprocessar cupons pendentes' },
    };

    const els = {
        messages: document.getElementById('chatMessages'),
        type: document.getElementById('msgType'),
        text: document.getElementById('textInput'),
        file: document.getElementById('fileInput'),
        send: document.getElementById('sendBtn'),
    };

    let busy = false;

    function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Aceita o negrito do WhatsApp (*texto*) e do Markdown (**texto**), sempre escapando o HTML antes.
    function formatBotText(text) {
        return escapeHtml(text)
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<strong>$1</strong>');
    }

    function addMessage(role, { text = '', html = '', node = null, pending = false } = {}) {
        const bubble = document.createElement('div');
        bubble.className = `message ${role}-message${pending ? ' pending' : ''}`;
        if (html) bubble.innerHTML = html; else bubble.textContent = text;
        if (node) bubble.appendChild(node);
        els.messages.appendChild(bubble);
        els.messages.scrollTop = els.messages.scrollHeight;
        return bubble;
    }

    function setBusy(value) {
        busy = value;
        els.send.disabled = value;
    }

    function updateInputs() {
        const cfg = TYPES[els.type.value];
        els.text.hidden = cfg.input !== 'text';
        els.file.hidden = cfg.input !== 'file';
        if (cfg.accept) els.file.accept = cfg.accept;
        els.file.value = '';
    }

    // Monta a mensagem do usuário e o corpo da requisição; devolve null se faltar algo.
    function buildRequest(type) {
        const cfg = TYPES[type];

        if (!cfg.input) {
            addMessage('user', { text: cfg.userText });
            return { endpoint: cfg.endpoint, options: { method: cfg.method } };
        }

        const formData = new FormData();
        formData.append('type', type);

        if (cfg.input === 'text') {
            const content = els.text.value.trim();
            if (!content) return null;
            addMessage('user', { text: content });
            formData.append(cfg.field, content);
            els.text.value = '';
        } else {
            const file = els.file.files[0];
            if (!file) {
                alert('Selecione um arquivo primeiro!');
                return null;
            }
            formData.append(cfg.field, file);
            if (file.type.startsWith('image/')) {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                addMessage('user', { text: cfg.label, node: img });
            } else {
                addMessage('user', { text: `${cfg.label}: ${file.name}` });
            }
            els.file.value = '';
        }

        return { endpoint: '/webhook/whatsapp', options: { method: 'POST', body: formData } };
    }

    async function sendMessage() {
        if (busy) return;

        const request = buildRequest(els.type.value);
        if (!request) return;

        setBusy(true);
        const pending = addMessage('bot', { text: 'Processando...', pending: true });

        try {
            const response = await fetch(request.endpoint, request.options);
            const data = await response.json();
            pending.classList.remove('pending');
            pending.innerHTML = formatBotText(data.response_message || JSON.stringify(data));
        } catch (error) {
            pending.classList.remove('pending');
            pending.textContent = '❌ Erro de conexão com a API Flask.';
        } finally {
            setBusy(false);
            els.messages.scrollTop = els.messages.scrollHeight;
        }
    }

    els.type.addEventListener('change', updateInputs);
    els.send.addEventListener('click', sendMessage);
    els.text.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') sendMessage();
    });

    updateInputs();
</script>

</body>
</html>
